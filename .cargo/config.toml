# Scope SYSTEM_DEPS_BUILD_INTERNAL=always strictly to Windows targets
# so Linux and macOS continue using system pkg-config (libdav1d-dev / brew install dav1d).

[target.x86_64-pc-windows-msvc.env]
SYSTEM_DEPS_BUILD_INTERNAL = "always"

[target.i686-pc-windows-msvc.env]
SYSTEM_DEPS_BUILD_INTERNAL = "always"

[target.aarch64-pc-windows-msvc.env]
SYSTEM_DEPS_BUILD_INTERNAL = "always"

[target.x86_64-pc-windows-gnu.env]
SYSTEM_DEPS_BUILD_INTERNAL = "always"
