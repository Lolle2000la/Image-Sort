# Snap packaging for Media Sort.
#
# Classic confinement: Media Sort is a media sorter/file browser whose whole
# purpose is to open, move, copy, rename and trash arbitrary user files anywhere
# on the filesystem (any mount, any drive, any path reachable by the file
# picker), exactly like the AppImage build. The snap interfaces a strict
# confinement could offer (home, removable-media, ...) cannot express that, so
# the snap is classic like other file managers and media tools. Classic
# confinement is a manual-review capability in the Snap Store; the snap name
# below must be approved for classic before the release workflow can publish.
#
# Build:   snapcraft pack --destructive-mode     (host must be Ubuntu 24.04)
# Lint:    snapcraft lint <file.snap>
# Install: sudo snap install --classic ./media-sort_*_<arch>.snap
#          (add --dangerous for a locally built, unsigned snap)
#
# It is a classic snap, so `--classic` is required. The `media-sort` name in the
# Snap Store must be approved for classic confinement before the Store release
# step in .github/workflows/release.yml can publish it.

name: media-sort
title: Media Sort
summary: Fast, keyboard-driven media sorter for photos, video and audio
description: |
  Media Sort is a fast, native desktop application for browsing, sorting and
  organising large photo, video and audio collections.

  It is keyboard-first, with full undo/redo, pinned destination folders, an
  in-app image/video/audio preview (video and GIF playback via libmpv, audio
  via symphonia/rodio) and an EXIF/ID3 metadata panel. It runs entirely on
  your machine: no accounts, no analytics and no network access beyond the
  optional update check.

  The snap bundles libmpv, libdav1d, ffmpeg and ALSA support, so no separate
  runtime dependency installation is required on Ubuntu-based systems.

license: AGPL-3.0-or-later
website: https://mediasort.app/
source-code: https://github.com/Lolle2000la/Media-Sort
issues: https://github.com/Lolle2000la/Media-Sort/issues
contact: https://github.com/Lolle2000la/Media-Sort/issues

base: core24
# The default, store-publishable variant is strictly confined: it can sort
# anything under $HOME and, once `removable-media` is connected, on removable
# drives. The full-filesystem variant is the *same* project built with
# `scripts/build-snap.sh classic` (which switches to `confinement: classic` and
# drops the plugs below) and is published to the `latest/classicmode` track; it
# needs the store's classic-confinement approval. See scripts/build-snap.sh and
# the "Snap packaging" section of AGENTS.md.
confinement: strict
grade: stable

# The version is read from [workspace.package].version in Cargo.toml (the same
# single source of truth the binary reports and the release pipeline verifies),
# so the version can never drift from the tag it was cut from.
adopt-info: media-sort

platforms:
  amd64:
  arm64:

apps:
  media-sort:
    command: bin/media-sort-gui
    plugs:
      # `home` is auto-connected. `removable-media` (/media, /mnt) is not, so
      # sorting external drives requires one manual
      # `snap connect media-sort:removable-media`.
      - home
      - removable-media
      # Display server, portals/xdg-open and GPU (/dev/dri for the wgpu
      # Vulkan/GL backend). wayland/x11/opengl are auto-connected.
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      # Audio output (rodio/cpal) through the PulseAudio/PipeWire socket.
      - audio-playback

parts:
  media-sort:
    plugin: rust
    source: .
    # Build only the GUI crate. `cargo install --path` (what the rust plugin
    # runs for a package member) resolves the workspace dependency closure
    # (media-sort-core, media-sort-backend, mpv-utils, ...) and installs the
    # `media-sort-gui` binary into $CRAFT_PART_INSTALL/bin. The `velopack`
    # feature is intentionally left off: a snap is updated by snapd, so the
    # in-app self-updater is neither built nor offered.
    rust-path:
      - crates/media-sort-gui
    # The strict variant gets a PATH/LD_LIBRARY_PATH command-chain from
    # snapcraft, but the classic variant does not (and snapd scrubs
    # LD_LIBRARY_PATH), so without this the staged libmpv.so.2 would be
    # unresolved there and the app would fail to start. patchelf writes an
    # `$ORIGIN`-relative RPATH (e.g. `$ORIGIN/../usr/lib/x86_64-linux-gnu:...`)
    # so the staged libraries resolve in both variants, and DT_RPATH is
    # inherited by their own dependencies. Harmless in the strict variant.
    build-attributes:
      - enable-patchelf
    build-packages:
      # libmpv-sys generates its bindings with bindgen, which needs libclang.
      - clang
      - libclang-dev
      # Vendored libjpeg-turbo (turbojpeg-sys) builds with CMake; NASM is used
      # for its SIMD paths on x86/x86_64.
      - cmake
      - nasm
      - build-essential
      - pkg-config
      # libmpv (video/GIF playback), ALSA (rodio/cpal audio output) and dav1d
      # (AVIF image decoding) headers. dav1d is found via pkg-config, so the
      # vendored meson fallback is not exercised.
      - libmpv-dev
      - libasound2-dev
      - libdav1d-dev
    stage-packages:
      # Runtime counterparts of the -dev packages above. Snapcraft pulls their
      # transitive dependencies (libav*, ...) automatically.
      - libmpv2
      - libasound2t64
      - libdav1d7
      # The ffmpeg CLI, used for fast video thumbnails and as the AVIF decode
      # fallback. Its libav* dependencies are already pulled in by libmpv2, so
      # this mainly adds the frontend plus the encoder libraries.
      - ffmpeg
    override-build: |
      craftctl default
      # Classic snaps get no snapcraft PATH command-chain, and the app's
      # `find_ffmpeg()` (media-sort-backend) checks the binary's own directory
      # before PATH. Expose the staged ffmpeg next to the binary so the lookup
      # is deterministic regardless of how snapd sets PATH.
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      ln -sf ../usr/bin/ffmpeg "$CRAFT_PART_INSTALL/bin/ffmpeg"
      version="$(awk '
        /^\[workspace\.package\]/ { in_section = 1; next }
        /^\[/ { in_section = 0 }
        in_section && /^version[[:space:]]*=/ { gsub(/^[^"]*"|".*$/, ""); print; exit }
      ' "$CRAFT_PART_SRC/Cargo.toml")"
      [ -n "$version" ] || { echo "could not read [workspace.package].version from Cargo.toml"; exit 1; }
      craftctl set version="$version"
