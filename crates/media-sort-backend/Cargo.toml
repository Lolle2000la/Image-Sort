[package]
name = "media-sort-backend"
version.workspace = true
edition.workspace = true

[dependencies]
media-sort-core = { path = "../media-sort-core" }
image.workspace = true
notify.workspace = true
notify-debouncer-mini.workspace = true
trash.workspace = true
walkdir.workspace = true
kamadak-exif.workspace = true
symphonia.workspace = true
rodio.workspace = true
id3.workspace = true
metaflac.workspace = true
mp4ameta.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
iced-mpv = { path = "../iced-mpv", default-features = false }
chrono = "0.4"
fast_image_resize.workspace = true
rayon.workspace = true
turbojpeg = "1.5"

[target.'cfg(target_os = "windows")'.dependencies]
winreg.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSURL", "NSString", "NSError"] }

# Native AVIF decode (dav1d) everywhere except i686-pc-windows-msvc: that
# target is cross-compiled from an x86_64 host, and dav1d-sys's vendored meson
# build has no cross-file support (system-deps refuses cross pkg-config).
# There, AVIF decodes via the bundled ffmpeg pipe fallback (see
# format_pipeline::avif_image). aarch64-pc-windows-msvc stays native, using
# clang-cl for the meson build (see release.yml).
[target.'cfg(not(all(target_os = "windows", target_arch = "x86")))'.dependencies]
image = { workspace = true, features = ["avif-native"] }

