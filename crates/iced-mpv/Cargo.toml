[package]
name = "iced-mpv"
version.workspace = true
edition.workspace = true
license = "MIT"
repository = "https://github.com/Lolle2000la/Image-Sort"

[features]
default = ["ui"]
# Enables the ready-made widgets (controls bar + composite player view) which
# depend on the `lucide-icons` font. Without it only the iced subscription,
# state machine and raw shader view are available.
ui = ["dep:lucide-icons"]

[dependencies]
mpv-utils = { path = "../mpv-utils" }
iced = { workspace = true, features = ["wgpu", "tokio", "advanced"] }
iced_wgpu = "0.14"
bytemuck = "1"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
tracing = { workspace = true }
lucide-icons = { version = "1.21", optional = true }
