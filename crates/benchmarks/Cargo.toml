[package]
name = "benchmarks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
media-sort-backend = { path = "../media-sort-backend" }
media-sort-core = { path = "../media-sort-core" }
toml.workspace = true
image.workspace = true
fast_image_resize.workspace = true
zune-jpeg = "0.5"
zune-core = "0.5"
mpv-utils = { path = "../mpv-utils" }
turbojpeg = "1.5"
kamadak-exif.workspace = true
webp = "0.3"
bytemuck = "1"
ico = "0.5"

# Mirrors the backend: native AVIF decode everywhere except i686-pc-windows-msvc.
[target.'cfg(not(all(target_os = "windows", target_arch = "x86")))'.dependencies]
image = { workspace = true, features = ["avif-native"] }

[dev-dependencies]
divan = "0.1"
rayon.workspace = true

[[bench]]
name = "image_thumbnails"
harness = false

[[bench]]
name = "preview"
harness = false

[[bench]]
name = "video_thumbnails"
harness = false

[[bench]]
name = "format_thumbnails"
harness = false

[[bench]]
name = "format_previews"
harness = false

[[bench]]
name = "perf_candidates"
harness = false
