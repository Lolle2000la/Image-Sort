name: Snap packaging

# The snap recipe is built against a *clean* environment: only the Ubuntu
# archive's `build-packages`, and none of the libraries a GitHub runner happens
# to have installed. That is the one thing the normal CI build cannot check,
# because it links against whatever the runner provides. Hence the path filter:
# this runs when the recipe, or anything that can change linkage, changes -- not
# on every push, since each run compiles the whole workspace from scratch.
#
# Application code is deliberately not a trigger: the ordinary CI build already
# compiles the same crates. The narrow exceptions (a `build.rs` that starts
# probing a system library, a new runtime `dlopen`) are rare enough not to
# justify a Rust build per push -- and `workflow_dispatch` runs this on demand.
on:
  push:
    branches: [master]
    paths:
      - 'snap/**'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/snap.yml'
      # The in-sandbox check this workflow runs; a change to it changes what is
      # verified, so it has to re-run here too.
      - 'scripts/check-snap-confinement.sh'
  pull_request:
    branches: [master]
    paths:
      - 'snap/**'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/snap.yml'
      - 'scripts/check-snap-confinement.sh'
  # No `merge_group` on purpose: path filters are silently ignored for it, so it
  # would run on every queued merge instead of only for snap/dependency changes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snap:
    name: Build and check the snap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Canonical's action installs and configures snapd, LXD and snapcraft,
      # then builds inside an LXD container pinned to the recipe's base
      # (core24 = Ubuntu 24.04). That is what lets this job run on any runner
      # release: `--destructive-mode` only accepts a host that *is* the base, so
      # pinning the runner to `ubuntu-24.04` was load-bearing, and a runner bump
      # broke the job. Building in the base container also makes the "clean
      # environment" guarantee real -- only the recipe's `build-packages`, never
      # the libraries the runner happens to ship. One architecture is enough to
      # prove the recipe resolves, so build only `amd64`; `--platform` must name
      # one of `platforms:` in snap/snapcraft.yaml.
      - name: Build Snap
        id: snapcraft
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
        with:
          snapcraft-args: pack --platform amd64

      # Installing it, connecting the `gpu-2404` provider and checking it from
      # *inside* the sandbox all live in scripts/check-snap-confinement.sh: the
      # release workflow has to make the same check before it publishes, and this
      # is the part the ordinary CI build cannot see, because it links against
      # whatever the runner happens to have.
      - name: Check the snap in its confinement
        run: scripts/check-snap-confinement.sh "${{ steps.snapcraft.outputs.snap }}"
