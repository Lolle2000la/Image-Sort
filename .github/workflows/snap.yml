name: Snap packaging

# The snap recipe is built against a *clean* environment: only the Ubuntu
# archive's `build-packages`, and none of the libraries a GitHub runner happens
# to have installed. That is the one thing the normal CI build cannot check,
# because it links against whatever the runner provides. Hence the path filter:
# this runs when the recipe, or anything that can change linkage, changes -- not
# on every push, since each run compiles the whole workspace from scratch.
#
# Application code is deliberately not a trigger: the ordinary CI build already
# compiles the same crates. The narrow exceptions (a `build.rs` that starts
# probing a system library, a new runtime `dlopen`) are rare enough not to
# justify a Rust build per push -- and `workflow_dispatch` runs this on demand.
on:
  push:
    branches: [master]
    paths:
      - 'snap/**'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/snap.yml'
  pull_request:
    branches: [master]
    paths:
      - 'snap/**'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/snap.yml'
  # No `merge_group` on purpose: path filters are silently ignored for it, so it
  # would run on every queued merge instead of only for snap/dependency changes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snap:
    name: Build and check the snap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Canonical's action installs and configures snapd, LXD and snapcraft,
      # then builds inside an LXD container pinned to the recipe's base
      # (core24 = Ubuntu 24.04). That is what lets this job run on any runner
      # release: `--destructive-mode` only accepts a host that *is* the base, so
      # pinning the runner to `ubuntu-24.04` was load-bearing, and a runner bump
      # broke the job. Building in the base container also makes the "clean
      # environment" guarantee real -- only the recipe's `build-packages`, never
      # the libraries the runner happens to ship. One architecture is enough to
      # prove the recipe resolves, so build only `amd64`; `--platform` must name
      # one of `platforms:` in snap/snapcraft.yaml.
      - name: Build Snap
        id: snapcraft
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
        with:
          snapcraft-args: pack --platform amd64

      - name: Install Built Snap
        run: |
          set -euo pipefail
          sudo snap install --dangerous "${{ steps.snapcraft.outputs.snap }}"
          snap list media-sort

      # The snap carries no graphics userspace of its own: it comes from the
      # `gpu-2404` content provider (see snap/snapcraft.yaml), which the Store
      # installs as a default-provider dependency. A local `--dangerous` install
      # does not pull it in, so do it here -- without it the app cannot start.
      - name: Install and connect the graphics provider
        run: |
          set -euo pipefail
          snap list mesa-2404 >/dev/null 2>&1 || sudo snap install mesa-2404
          if ! snap connections media-sort | grep -q "mesa-2404:gpu-2404"; then
            sudo snap connect media-sort:gpu-2404 mesa-2404
          fi
          snap connections media-sort | grep gpu-2404

      # Everything below runs *inside* the sandbox, which is the part the normal
      # CI build cannot see: it links against whatever the runner happens to have.
      - name: Check the payload resolves in confinement
        run: |
          set -euo pipefail
          sudo snap run --shell media-sort <<'SNAP_SH'
          set -euo pipefail
          if ldd "$SNAP/bin/media-sort-gui" | grep -q "not found"; then
            echo "::error::the staged binary has unresolved libraries inside the snap:"
            ldd "$SNAP/bin/media-sort-gui" | grep "not found"
            exit 1
          fi
          # The gpu-2404 part's cleanup must have removed the graphics libraries:
          # the provider is their single source, and a leftover copy is precisely
          # the driver mismatch that interface exists to prevent.
          for pruned in \
            usr/lib/x86_64-linux-gnu/libEGL_mesa.so.0 \
            usr/lib/x86_64-linux-gnu/libva.so.2 \
            usr/lib/x86_64-linux-gnu/dri
          do
            if [ -e "$SNAP/$pruned" ]; then
              echo "::error::$pruned should have been pruned by gpu-2404-cleanup"
              exit 1
            fi
          done
          # ffmpeg links libva/libvdpau, so it only runs with the provider's
          # environment -- the same wrapper the app's command-chain goes through.
          echo "bundled ffmpeg: $("$SNAP/bin/gpu-2404-wrapper" "$SNAP/bin/ffmpeg" -version | head -1)"
          SNAP_SH

      # `snap run` is the path users take, so it should reach the dynamic loader
      # without complaining. With no display the app cannot open its window and
      # exits non-zero -- that is expected; only a loader failure is a problem.
      - name: Check the app launcher reaches the loader
        run: |
          set -euo pipefail
          output="$(timeout 60 snap run media-sort 2>&1 || true)"
          printf '%s\n' "$output" | tail -5
          if printf '%s' "$output" | grep -q "error while loading shared libraries"; then
            echo "::error::the app could not load its libraries through 'snap run'"
            exit 1
          fi
          # The wrapper bails out before exec when the provider is missing, which
          # would otherwise look like "the app just exits" here.
          if printf '%s' "$output" | grep -q "gpu-2404 interface isn't connected"; then
            echo "::error::the gpu-2404 interface is not connected, so the app refused to start"
            exit 1
          fi
