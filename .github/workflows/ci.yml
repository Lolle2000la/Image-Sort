name: CI Pipeline

on:
  push:
    branches: [main, v3.0]
    paths-ignore:
      - 'website/**'
      - 'README.md'
  pull_request:
    branches: [main, v3.0]
    paths-ignore:
      - 'website/**'
      - 'README.md'

env:
  CARGO_TERM_COLOR: always
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  fmt:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows-latest'
        with:
          arch: x64

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v3.0' }}

      - uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev libasound2-dev libdav1d-dev nasm

      - name: Install System Dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install mpv dav1d
          echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Setup libmpv Link Libraries (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p libs
          if [ ! -f mpv-dev.7z ]; then
            curl -L -o mpv-dev.7z https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260610/mpv-dev-x86_64-20260610-git-304426c.7z
          fi
          7z e mpv-dev.7z libmpv-2.dll -olibs -y
          7z e mpv-dev.7z libmpv.dll.a -olibs -y
          mv libs/libmpv.dll.a libs/mpv.lib
          echo "$(cygpath -w "$PWD")\\libs" >> "$GITHUB_PATH"

      - name: Setup dav1d/libjpeg-turbo Build Tools (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          pip install meson ninja
          if ! command -v nasm &> /dev/null; then
            choco install -y nasm pkgconfiglite
          fi
          echo "SYSTEM_DEPS_DAV1D_BUILD_INTERNAL=always" >> "$GITHUB_ENV"

      - name: Run Clippy Lints
        env:
          RUSTC_WRAPPER: sccache
          LIBRARY_PATH: ${{ matrix.os == 'macos-latest' && '/opt/homebrew/lib' || '' }}
          RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-L native=libs' || '' }}
        run: cargo --config 'profile.dev.package."*".opt-level=0' clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Tests
        if: matrix.os != 'windows-latest'
        env:
          RUSTC_WRAPPER: sccache
          LIBRARY_PATH: ${{ matrix.os == 'macos-latest' && '/opt/homebrew/lib' || '' }}
        run: cargo --config 'profile.dev.package."*".opt-level=0' nextest run --workspace --lib --bins --tests

      - name: Run Doc Tests
        if: matrix.os != 'windows-latest'
        env:
          RUSTC_WRAPPER: sccache
          LIBRARY_PATH: ${{ matrix.os == 'macos-latest' && '/opt/homebrew/lib' || '' }}
        run: cargo --config 'profile.dev.package."*".opt-level=0' test --doc --workspace

      - name: Run Workspace Tests (Windows, excluding GUI)
        if: matrix.os == 'windows-latest'
        env:
          RUSTC_WRAPPER: sccache
          RUSTFLAGS: '-L native=libs'
        run: cargo --config 'profile.dev.package."*".opt-level=0' nextest run --workspace --lib --bins --tests --exclude media-sort-gui

      - name: Run Doc Tests (Windows, excluding GUI)
        if: matrix.os == 'windows-latest'
        env:
          RUSTC_WRAPPER: sccache
          RUSTFLAGS: '-L native=libs'
        run: cargo --config 'profile.dev.package."*".opt-level=0' test --doc --workspace --exclude media-sort-gui

      - name: Run GUI Tests (Windows, serial)
        if: matrix.os == 'windows-latest'
        env:
          RUSTC_WRAPPER: sccache
          RUSTFLAGS: '-L native=libs'
        run: cargo --config 'profile.dev.package."*".opt-level=0' test -p media-sort-gui --tests -- --test-threads=1 --nocapture

  verify-contributors:
    name: Verify Contributors List
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify PR Author in contributors.json
        if: github.event_name == 'pull_request'
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          echo "Checking if contributor '$AUTHOR' is listed in contributors.json..."
          if jq -e --arg user "$AUTHOR" '.[] | select(.github == $user)' contributors.json > /dev/null; then
            echo "Success: '$AUTHOR' is listed in contributors.json."
          else
            echo "::error::PR author '$AUTHOR' is not listed in contributors.json! Please add yourself to the contributors.json file at the root of the repository."
            exit 1
          fi