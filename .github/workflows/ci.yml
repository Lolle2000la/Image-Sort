name: CI Pipeline

on:
  push:
    branches: [main, v3.0]
    paths-ignore:
      - 'website/**'
      - 'README.md'
  pull_request:
    branches: [main, v3.0]
    paths-ignore:
      - 'website/**'
      - 'README.md'
  merge_group:
    # Path filters are NOT supported for the merge_group event (they are
    # silently ignored), so merge-queue runs always execute every job.
    # Required checks must still report here or queued PRs block forever.
    branches: [main, v3.0]
    types: [checks_requested]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-latest-cargo-

      - name: Install System Dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            sudo apt-get update
            sudo apt-get install -y libmpv-dev libasound2-dev libdav1d-dev nasm

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        # Clippy flags the same issues on every OS, so run it once on Linux
        # instead of once per matrix entry -- but with every target and every
        # feature enabled so the single run still covers all code paths
        # (velopack, demo, headless, avif-native, ...).
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            sudo apt-get update
            sudo apt-get install -y libmpv-dev libasound2-dev libdav1d-dev nasm

      - name: Install System Dependencies (macOS)
        if: matrix.os == 'macos-latest'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            brew install mpv dav1d
            echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Setup libmpv Link Libraries (Windows)
        if: matrix.os == 'windows-latest'
        uses: nick-fields/retry@v4
        env:
          # gh refuses to run without a token in Actions contexts; the
          # runner does not inject GH_TOKEN into action processes, only
          # run steps that reference github.token explicitly get one.
          GH_TOKEN: ${{ github.token }}
          # Pin the vendored libmpv/ffmpeg build tag. The monthly
          # bump-mpv-winbuild workflow PRs this default; a repository
          # variable of the same name overrides it (empty = latest).
          MPV_WINBUILD_TAG: ${{ vars.MPV_WINBUILD_TAG || '2026-08-08-dd5d17d328' }}
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          shell: bash
          command: |
            # nick-fields/retry@v4 spawns the command without set -e, so
            # failures would otherwise be swallowed and the step would
            # "succeed" with garbage artifacts; be explicit.
            set -euo pipefail
            # nick-fields/retry@v4 runs `command` in a different working
            # directory than GITHUB_WORKSPACE (it cannot honor
            # working-directory), so all paths must be absolute -- a
            # relative "libs" would not be found by the linker's
            # "/LIBPATH:libs" at build time.
            mkdir -p "$GITHUB_WORKSPACE/libs"
            # Vendored builds come from our self-hosted mpv-winbuild fork
            # (Lolle2000la/mpv-winbuild).
            if [ -n "${MPV_WINBUILD_TAG:-}" ]; then
              RELEASE_SPEC="$MPV_WINBUILD_TAG"
            else
              RELEASE_SPEC="$(gh release view --repo Lolle2000la/mpv-winbuild --json tagName --jq .tagName)"
            fi
            [ -n "$RELEASE_SPEC" ] || { echo "::error::could not resolve mpv-winbuild release"; exit 1; }
            MPV_ASSET=$(gh release view "$RELEASE_SPEC" --repo Lolle2000la/mpv-winbuild --json assets --jq '.assets[].name | select(startswith("mpv-dev-x86_64") and endswith(".7z") and (contains("-lgpl") | not) and (contains("-v3") | not))' | head -n 1)
            [ -n "$MPV_ASSET" ] || { echo "::error::no mpv-dev-x86_64 asset in release $RELEASE_SPEC"; exit 1; }
            curl -fL -o mpv-dev.7z "https://github.com/Lolle2000la/mpv-winbuild/releases/download/$RELEASE_SPEC/$MPV_ASSET"
            7z e mpv-dev.7z libmpv-2.dll "-o$GITHUB_WORKSPACE/libs" -y
            7z e mpv-dev.7z libmpv.dll.a "-o$GITHUB_WORKSPACE/libs" -y
            mv "$GITHUB_WORKSPACE/libs/libmpv.dll.a" "$GITHUB_WORKSPACE/libs/mpv.lib"
            # Test binaries link libmpv-2.dll at load time; make it resolvable.
            # (cygpath: $PWD is POSIX-form in git-bash, which the Windows DLL
            # loader cannot use as a PATH entry.)
            echo "$(cygpath -w "$GITHUB_WORKSPACE")\\libs" >> "$GITHUB_PATH"

      - name: Setup dav1d/libjpeg-turbo Build Tools (Windows)
        if: matrix.os == 'windows-latest'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          shell: bash
          command: |
            pip install meson ninja
            choco install -y nasm pkgconfiglite
            # system-deps defaults BUILD_INTERNAL to "never" and hard-fails
            # when pkg-config is absent (always on Windows runners); force
            # the vendored meson build instead.
            echo "SYSTEM_DEPS_DAV1D_BUILD_INTERNAL=always" >> "$GITHUB_ENV"

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows-latest'
        with:
          arch: x64

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Cache Bench Fixtures
        uses: actions/cache@v6
        with:
          path: target/media-sort-fixtures
          # Keyed on the generator + the source image: any change misses and
          # regenerates. The code also self-validates via the VERSION marker.
          key: ${{ matrix.os }}-fixtures-${{ hashFiles('crates/benchmarks/src/fixture_gen.rs', 'resources/MockState/mock 1.jpg') }}

      - name: Run Workspace Tests
        env:
          LIBRARY_PATH: ${{ matrix.os == 'macos-latest' && '/opt/homebrew/lib' || '' }}
          RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-L native=libs' || '' }}
        # nextest runs each test in its own process, so the previous Windows
        # split (exclude the GUI crate, then rerun it serially to work around
        # a parallel access-violation crash) is no longer needed -- the same
        # command works on all OSes. Bench targets (divan, harness=false)
        # are skipped, matching the old `--tests` selection.
        # NOTE: keep the default shell. Under git-bash, /usr/bin precedes the
        # MSVC dirs in PATH and rustc invokes GNU coreutils' `link` instead of
        # MSVC link.exe.
        run: cargo nextest run --workspace

      - name: Run Doctests
        env:
          LIBRARY_PATH: ${{ matrix.os == 'macos-latest' && '/opt/homebrew/lib' || '' }}
          RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-L native=libs' || '' }}
        # cargo-nextest does not run doctests, and the old `--tests` selection
        # skipped them too -- run them explicitly so this coverage is gained
        # rather than lost by the switch.
        run: cargo test --workspace --doc

  verify-contributors:
    name: Verify Contributors List
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify PR Author in contributors.json
        if: github.event_name == 'pull_request'
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          echo "Checking if contributor '$AUTHOR' is listed in contributors.json..."
          if jq -e --arg user "$AUTHOR" '.[] | select(.github == $user)' contributors.json > /dev/null; then
            echo "Success: '$AUTHOR' is listed in contributors.json."
          else
            echo "::error::PR author '$AUTHOR' is not listed in contributors.json! Please add yourself to the contributors.json file at the root of the repository."
            exit 1
          fi
