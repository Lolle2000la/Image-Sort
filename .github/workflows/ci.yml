name: CI Pipeline

on:
  push:
    branches: [main, v3.0]
    paths-ignore:
      - 'website/**'
      - 'README.md'
  pull_request:
    branches: [main, v3.0]
    paths-ignore:
      - 'website/**'
      - 'README.md'

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Test & Lint (${{ matrix.os }})
    needs: fmt
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            sudo apt-get update
            sudo apt-get install -y libmpv-dev libasound2-dev libdav1d-dev nasm

      - name: Install System Dependencies (macOS)
        if: matrix.os == 'macos-latest'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            brew install mpv dav1d
            echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Setup libmpv Link Libraries (Windows)
        if: matrix.os == 'windows-latest'
        uses: nick-fields/retry@v4
        env:
          # gh refuses to run without a token in Actions contexts; the
          # runner does not inject GH_TOKEN into action processes, only
          # run steps that reference github.token explicitly get one.
          GH_TOKEN: ${{ github.token }}
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          shell: bash
          command: |
            # nick-fields/retry@v4 runs `command` in a different working
            # directory than GITHUB_WORKSPACE (it cannot honor
            # working-directory), so all paths must be absolute -- a
            # relative "libs" would not be found by the linker's
            # "/LIBPATH:libs" at build time.
            mkdir -p "$GITHUB_WORKSPACE/libs"
            # zhongfly/mpv-winbuild publishes a fresh build daily but retains
            # only the last 30 days of builds, so the latest tag is resolved
            # at runtime instead of being pinned.
            RELEASE_TAG=$(gh release view --repo zhongfly/mpv-winbuild --json tagName --jq .tagName)
            MPV_ASSET=$(gh release view --repo zhongfly/mpv-winbuild --json assets --jq '.assets[].name | select(startswith("mpv-dev-x86_64") and endswith(".7z") and (contains("-lgpl") | not) and (contains("-v3") | not))' | head -n 1)
            curl -L -o mpv-dev.7z "https://github.com/zhongfly/mpv-winbuild/releases/download/$RELEASE_TAG/$MPV_ASSET"
            7z e mpv-dev.7z libmpv-2.dll "-o$GITHUB_WORKSPACE/libs" -y
            7z e mpv-dev.7z libmpv.dll.a "-o$GITHUB_WORKSPACE/libs" -y
            mv "$GITHUB_WORKSPACE/libs/libmpv.dll.a" "$GITHUB_WORKSPACE/libs/mpv.lib"
            # Test binaries link libmpv-2.dll at load time; make it resolvable.
            # (cygpath: $PWD is POSIX-form in git-bash, which the Windows DLL
            # loader cannot use as a PATH entry.)
            echo "$(cygpath -w "$GITHUB_WORKSPACE")\\libs" >> "$GITHUB_PATH"

      - name: Setup dav1d/libjpeg-turbo Build Tools (Windows)
        if: matrix.os == 'windows-latest'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          shell: bash
          command: |
            pip install meson ninja
            choco install -y nasm pkgconfiglite
            # system-deps defaults BUILD_INTERNAL to "never" and hard-fails
            # when pkg-config is absent (always on Windows runners); force
            # the vendored meson build instead.
            echo "SYSTEM_DEPS_DAV1D_BUILD_INTERNAL=always" >> "$GITHUB_ENV"

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows-latest'
        with:
          arch: x64

      - name: Run Clippy Lints
        env:
          LIBRARY_PATH: ${{ matrix.os == 'macos-latest' && '/opt/homebrew/lib' || '' }}
          RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-L native=libs' || '' }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Tests
        if: matrix.os != 'windows-latest'
        env:
          LIBRARY_PATH: ${{ matrix.os == 'macos-latest' && '/opt/homebrew/lib' || '' }}
        # --tests, not --all-targets: bench targets are harness=false, so
        # "testing" them would execute the full divan benchmark suite.
        run: cargo test --workspace --tests

      - name: Run Workspace Tests (Windows, excluding GUI)
        if: matrix.os == 'windows-latest'
        env:
          RUSTFLAGS: '-L native=libs'
        # NOTE: keep the default shell here. Under git-bash, /usr/bin precedes
        # the MSVC dirs in PATH and rustc invokes GNU coreutils' `link`
        # instead of MSVC link.exe.
        run: cargo test --workspace --tests --exclude media-sort-gui

      - name: Run GUI Tests (Windows, serial)
        if: matrix.os == 'windows-latest'
        env:
          RUSTFLAGS: '-L native=libs'
        # Serial + nocapture: native libs the GUI tests touch (trash-crate
        # COM, rodio/WASAPI) are suspects in a parallel access-violation
        # crash on headless runners; if it still crashes, nocapture names
        # the culprit test in the log.
        run: cargo test -p media-sort-gui --tests -- --test-threads=1 --nocapture

  verify-contributors:
    name: Verify Contributors List
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify PR Author in contributors.json
        if: github.event_name == 'pull_request'
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          echo "Checking if contributor '$AUTHOR' is listed in contributors.json..."
          if jq -e --arg user "$AUTHOR" '.[] | select(.github == $user)' contributors.json > /dev/null; then
            echo "Success: '$AUTHOR' is listed in contributors.json."
          else
            echo "::error::PR author '$AUTHOR' is not listed in contributors.json! Please add yourself to the contributors.json file at the root of the repository."
            exit 1
          fi
